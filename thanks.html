<!doctype html>

<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,follow">
<meta name="theme-color" content="#080b18">
<title>پیام شما ثبت شد | رادین سرلک</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Vazirmatn:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 15% 15%,#5141be2b,transparent 35%),radial-gradient(ellipse at 85% 80%,#19acc71b,transparent 35%),#080b18;color:#f4f6ff;font-family:Vazirmatn,sans-serif}
.en{font-family:Inter,sans-serif}
.card{width:min(600px,100%);text-align:center;padding:clamp(28px,6vw,56px);border:1px solid #a4b2ff26;border-radius:30px;background:#121830b8;box-shadow:0 30px 90px #0005;animation:appear .7s ease both}
.check{width:76px;height:76px;margin:0 auto 24px;border-radius:24px;display:grid;place-items:center;font-size:36px;color:#07101e;background:linear-gradient(135deg,#6ee7f9,#a78bfa);box-shadow:0 0 45px #6ee7f922}
h1{font-size:clamp(28px,5vw,42px);margin:0 0 12px}
.gradient{background:linear-gradient(100deg,#6ee7f9,#b6a4ff 55%,#fb83c4);background-clip:text;-webkit-background-clip:text;color:transparent}
p{color:#a6afca;line-height:1.9;margin:0 auto 26px;max-width:440px}
.btn{display:inline-flex;padding:12px 20px;border-radius:13px;background:linear-gradient(115deg,#6ee7f9,#a78bfa);color:#07101e;font-weight:800;text-decoration:none}
.switch{display:block;border:0;background:none;color:#a6afca;margin:22px auto 0;cursor:pointer;font:inherit;font-size:13px}
@keyframes appear{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){.card{animation:none}}
</style>
</head>
<body>
<main class="card" id="card">
<div class="check">✓</div>
<h1><span data-fa="ممنون از پیام شما!" data-en="Thanks for reaching out!">ممنون از پیام شما!</span></h1>
<p data-fa="پیام شما برای رادین ارسال شد. از اینکه وقت گذاشتید و ارتباط گرفتید سپاسگزارم؛ در اولین فرصت بررسی‌اش می‌کنم." data-en="Your message has been submitted to Radin. Thanks for taking the time to get in touch — I'll review it as soon as I can.">پیام شما برای رادین ارسال شد. از اینکه وقت گذاشتید و ارتباط گرفتید سپاسگزارم؛ در اولین فرصت بررسی‌اش می‌کنم.</p>
<a class="btn" href="./" data-fa="بازگشت به وب‌سایت" data-en="Back to portfolio">بازگشت به وب‌سایت</a>
<button class="switch" id="switch">English version</button>
</main>
<script>
let lang='fa';
document.getElementById('switch').addEventListener('click',()=>{
lang=lang==='fa'?'en':'fa';
document.documentElement.lang=lang;
document.documentElement.dir=lang==='en'?'ltr':'rtl';
document.body.classList.toggle('en',lang==='en');
document.querySelectorAll('[data-fa][data-en]').forEach(e=>e.textContent=e.dataset[lang]);
document.getElementById('switch').textContent=lang==='fa'?'English version':'نسخه فارسی';
document.title=lang==='fa'?'پیام شما ثبت شد | رادین سرلک':'Message received | Radin Sarlak';
});
</script>
</body>
</html>
